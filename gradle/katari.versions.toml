[versions]
# Used in [/gradle/build-logic/src/main/kotlin/PluginAndroidBase.kt] and
# [/gradle/build-logic/src/main/kotlin/PluginKotlinMultiplatform.kt]
android-sdk-min = "29"
android-sdk-compile = "37.2"
android-sdk-target = "37"
android-ndk = "29.0.14206865"
java = "17"
# The JetBrains Runtime with JCEF (the jbr_jcef archives of https://github.com/JetBrains/JetBrainsRuntime/releases) that
# :desktop:run and the extension harness run on, with the SHA-512 sum JetBrains publishes beside each archive. Used in
# [/gradle/build-logic/src/main/kotlin/app/katari/gradle/jetbrainsruntime/JetBrainsRuntime.kt].
jbr = "25.0.4.1"
jbr-build = "b635.79"
jbr-linux-x64-sha512 = "b85de554ec25d6e87b306ad6eb6027e705049d3e6b2264da2b7778276c971f926d1b0a1064197a363beea43f51cf70e247ae74d4c9b481f628e35306dbaf48b4"
jbr-linux-aarch64-sha512 = "da337b8554517189af6ca70ecbab40e63932b41bef84282f88d62fb0db1190d4570b152116f8d46ad178642cb84abc1628ff93123fca365b28b24ee4c4b6be12"
# The same runtime's SDK (jbrsdk_jcef), whose jmods and jlink link the smaller runtime the AppImage ships. x86_64 only,
# as the AppImage is. Used in [/gradle/build-logic/src/main/kotlin/app/katari/gradle/appimage/DesktopAppImage.kt].
jbr-sdk-linux-x64-sha512 = "bd828d009f11c14fe85fbe2ad74169a21692f3e0bdb2124c74f0a9f98b5d16e878fa806974a62186e52096a3c7ea1556eabd9481fe8f2ad384b7cb980357be5e"
# Chromium for the desktop web view, which the AppImage leaves out and the app downloads when a web view is first
# needed: the Chromium of the runtime's JCEF above, named by that JCEF's version and commit, which checkChromiumVersion
# holds it to. :desktop:assembleChromiumArchive packs it and prints the archive's SHA-256, its size and the size of the
# files in it, both in bytes, and tools/chromium/publish-release.sh publishes it as the release chromium-<version>.
chromium = "150.0.14.1233-9df0879ddc3d"
chromium-linux-x64-sha256 = "a972b57e17cd82025961a0d9965b660aaaf9e52e89c74b2ce156bfb22af6d72e"
chromium-linux-x64-size = "113559996"
chromium-linux-x64-installed-size = "362092383"
# appimagetool (https://github.com/AppImage/appimagetool/releases) packs the desktop app into an AppImage, which starts
# through the AppImage type 2 runtime (https://github.com/AppImage/type2-runtime/releases), pinned here so packing
# downloads nothing unpinned. The sums are GitHub's SHA-256 digests of their x86_64 release files, the one architecture
# the desktop app is released for. Used in [/gradle/build-logic/src/main/kotlin/app/katari/gradle/appimage/AppImageTools.kt].
appimagetool = "1.9.1"
appimagetool-sha256 = "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
appimage-runtime = "20251108"
appimage-runtime-sha256 = "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d"

[plugins]
artifact-sanitizer = { id = "app.katari.plugins.artifact.sanitizer" }
android-application = { id = "app.katari.plugins.android.application" }
android-base = { id = "app.katari.plugins.android.base" }
android-library = { id = "app.katari.plugins.android.library" }
android-settings = { id = "app.katari.plugins.android.settings" }
android-test = { id = "app.katari.plugins.android.test" }
desktop-application = { id = "app.katari.plugins.desktop.application" }
compose = { id = "app.katari.plugins.compose" }
kotlin-jvm = { id = "app.katari.plugins.kotlin.jvm" }
kotlin-multiplatform = { id = "app.katari.plugins.kotlin.multiplatform" }
spotless = { id = "app.katari.plugins.spotless" }
