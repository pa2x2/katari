[versions]
# Used in [/gradle/build-logic/src/main/kotlin/PluginAndroidBase.kt] and
# [/gradle/build-logic/src/main/kotlin/PluginKotlinMultiplatform.kt]
android-sdk-min = "29"
android-sdk-compile = "37.2"
android-sdk-target = "37"
android-ndk = "29.0.14206865"
java = "17"
# The JetBrains Runtime with JCEF (the jbr_jcef archives of https://github.com/JetBrains/JetBrainsRuntime/releases) that
# :desktop:run and the extension harness run on, with the SHA-512 sum JetBrains publishes beside each archive. Used in
# [/gradle/build-logic/src/main/kotlin/mihon/gradle/jetbrainsruntime/JetBrainsRuntime.kt].
jbr = "25.0.4.1"
jbr-build = "b635.79"
jbr-linux-x64-sha512 = "b85de554ec25d6e87b306ad6eb6027e705049d3e6b2264da2b7778276c971f926d1b0a1064197a363beea43f51cf70e247ae74d4c9b481f628e35306dbaf48b4"
jbr-linux-aarch64-sha512 = "da337b8554517189af6ca70ecbab40e63932b41bef84282f88d62fb0db1190d4570b152116f8d46ad178642cb84abc1628ff93123fca365b28b24ee4c4b6be12"
# appimagetool (https://github.com/AppImage/appimagetool/releases) packs the desktop app into an AppImage, which starts
# through the AppImage type 2 runtime (https://github.com/AppImage/type2-runtime/releases), pinned here so packing
# downloads nothing unpinned. The sums are GitHub's SHA-256 digests of their x86_64 release files, the one architecture
# the desktop app is released for. Used in [/gradle/build-logic/src/main/kotlin/mihon/gradle/appimage/AppImageTools.kt].
appimagetool = "1.9.1"
appimagetool-sha256 = "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
appimage-runtime = "20251108"
appimage-runtime-sha256 = "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d"

[plugins]
artifact-sanitizer = { id = "mihon.plugins.artifact.sanitizer" }
android-application = { id = "mihon.plugins.android.application" }
android-base = { id = "mihon.plugins.android.base" }
android-library = { id = "mihon.plugins.android.library" }
android-settings = { id = "mihon.plugins.android.settings" }
android-test = { id = "mihon.plugins.android.test" }
desktop-application = { id = "mihon.plugins.desktop.application" }
compose = { id = "mihon.plugins.compose" }
kotlin-jvm = { id = "mihon.plugins.kotlin.jvm" }
kotlin-multiplatform = { id = "mihon.plugins.kotlin.multiplatform" }
spotless = { id = "mihon.plugins.spotless" }
