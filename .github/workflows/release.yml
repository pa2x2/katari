name: Release

# A push to main releases the app version once CHANGELOG.md has notes for it and no tag holds it
# yet. The release is a draft, to try the APKs before anyone is offered them, and its commit is
# tagged along with it.
on:
  push:
    branches:
      - main

env:
  KATARI_GITHUB_RELEASE: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  get_tag:
    name: Decide what to release
    runs-on: 'ubuntu-24.04'
    outputs:
      # Empty when there is nothing to release, which skips every other job.
      tag: ${{ steps.extract.outputs.tag }}
      notes: ${{ steps.extract.outputs.notes }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get tag name and release notes
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::app/build.gradle.kts versionName is not X.Y.Z or X.Y.Z-prerelease, got '$version'"
            exit 1
          fi
          tag="v$version"

          # The checkout is shallow and has no tags.
          released="$(git ls-remote --tags origin "refs/tags/$tag")"
          if [[ -n "$released" ]]; then
            echo "::notice::$tag is already released."
            exit 0
          fi

          # The version's section without its heading: the release is already named after it.
          notes="$(awk -v heading="## [$version]" '
            /^## \[/ { inside = index($0, heading) == 1; next }
            inside && (seen || NF) { seen = 1; print }
          ' CHANGELOG.md)"
          if [[ -z "$notes" ]]; then
            echo "::notice::CHANGELOG.md has no notes for $version, so this push releases nothing."
            exit 0
          fi

          {
            echo "tag=$tag"
            echo "notes<<END_OF_NOTES"
            echo "$notes"
            echo "END_OF_NOTES"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build
    runs-on: ubuntu-24.04
    needs: get_tag
    if: needs.get_tag.outputs.tag != ''

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build
        run: ./gradlew assembleRelease verifyExtensionRuntimeAbi -Pinclude-telemetry -Penable-updater
        env:
          storeFileBase64: ${{ secrets.SIGNING_KEY }}
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: |
          set -e

          mv app/build/outputs/apk/release/app-universal-release.apk katari-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-arm64-v8a-release.apk katari-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-armeabi-v7a-release.apk katari-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: katari
          path: |
            katari-${{ needs.get_tag.outputs.tag }}.apk
            katari-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
            katari-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk

  build_foss:
    name: Build (FOSS)
    runs-on: ubuntu-24.04
    needs: get_tag
    if: needs.get_tag.outputs.tag != ''

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Build
        run: ./gradlew assembleFoss
        env:
          storeFileBase64: ${{ secrets.SIGNING_KEY }}
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: |
          set -e

          # Per-ABI FOSS names contain neither "-foss" nor "-<abi>", which earlier app versions match to pick their
          # update; see ReleaseApkSelection.kt.
          mv app/build/outputs/apk/foss/app-universal-foss.apk katari-${{ needs.get_tag.outputs.tag }}-foss.apk
          mv app/build/outputs/apk/foss/app-arm64-v8a-foss.apk katari_foss_arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/foss/app-armeabi-v7a-foss.apk katari_foss_armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: katari-foss
          path: |
            katari-${{ needs.get_tag.outputs.tag }}-foss.apk
            katari_foss_arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
            katari_foss_armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk

  release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs: [get_tag, build, build_foss]
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Delete all artifacts
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          failOnError: false
          name: |
            katari
            katari-foss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.get_tag.outputs.tag }}
          name: ${{ needs.get_tag.outputs.tag }}
          # The commit GitHub tags on publishing, when the tag is not there yet.
          target_commitish: ${{ github.sha }}
          body: |
            ${{ needs.get_tag.outputs.notes }}

            > [!TIP]
            >
            > If you are unsure which version to download, use `katari-${{ needs.get_tag.outputs.tag }}.apk`.
          files: |
            katari-${{ needs.get_tag.outputs.tag }}.apk
            katari-${{ needs.get_tag.outputs.tag }}-foss.apk
            katari-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
            katari-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk
            katari_foss_arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
            katari_foss_armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk
          draft: true
          prerelease: false

      # GitHub tags a draft only once it is published. The tag goes in now, and last: it is what
      # tells later pushes to main that this version is released.
      - name: Tag the draft's commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.get_tag.outputs.tag }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA"
