name: Release

# A push to main releases each app whose version has notes in its changelog and no tag holding it yet: the Android app
# from versionName in app/build.gradle.kts and CHANGELOG.md, tagged v<version>, and the desktop app from version in
# desktop/build.gradle.kts and DESKTOP-CHANGELOG.md, tagged desktop-v<version>. One push can release either or both.
# Each release is a draft, to try it before anyone is offered it, and its commit is tagged along with it.
on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  get_tag:
    name: Decide what to release
    runs-on: 'ubuntu-26.04'
    outputs:
      # Each app's tag is empty when it has nothing to release, which skips its jobs.
      tag: ${{ steps.decide.outputs.android_tag }}
      notes: ${{ steps.decide.outputs.android_notes }}
      desktop_tag: ${{ steps.decide.outputs.desktop_tag }}
      desktop_version: ${{ steps.decide.outputs.desktop_version }}
      desktop_notes: ${{ steps.decide.outputs.desktop_notes }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get each app's tag name and release notes
        id: decide
        shell: bash
        run: |
          set -euo pipefail

          # release_of APP VERSION_FILE VERSION_PATTERN TAG_PREFIX CHANGELOG
          release_of() {
            local app="$1" file="$2" pattern="$3" prefix="$4" changelog="$5"

            local version
            version="$(sed -n "s/$pattern/\1/p" "$file")"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::$file has no X.Y.Z or X.Y.Z-prerelease version, got '$version'"
              exit 1
            fi
            local tag="$prefix$version"

            # The checkout is shallow and has no tags.
            if [[ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]]; then
              echo "::notice::$tag is already released."
              return
            fi

            # The version's section without its heading: the release is already named after it.
            local notes
            notes="$(awk -v heading="## [$version]" '
              /^## \[/ { inside = index($0, heading) == 1; next }
              inside && (seen || NF) { seen = 1; print }
            ' "$changelog")"
            if [[ -z "$notes" ]]; then
              echo "::notice::$changelog has no notes for $version, so this push releases no $tag."
              return
            fi

            {
              echo "${app}_tag=$tag"
              echo "${app}_version=$version"
              echo "${app}_notes<<END_OF_NOTES"
              echo "$notes"
              echo "END_OF_NOTES"
            } >> "$GITHUB_OUTPUT"
          }

          release_of android app/build.gradle.kts '^ *versionName = "\(.*\)"$' v CHANGELOG.md
          release_of desktop desktop/build.gradle.kts '^version = "\(.*\)"$' desktop-v DESKTOP-CHANGELOG.md

  build:
    name: Build
    runs-on: ubuntu-26.04
    needs: get_tag
    if: needs.get_tag.outputs.tag != ''

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Decode signing keystore
        run: echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/katari.keystore"
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      - name: Build
        run: ./gradlew assembleRelease verifyExtensionRuntimeAbi -Pinclude-telemetry
        env:
          # Signs with the keystore below; the desktop job has none, so the app's build script must not ask for it.
          KATARI_GITHUB_RELEASE: true
          storeFile: ${{ runner.temp }}/katari.keystore
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: |
          set -e

          mv app/build/outputs/apk/release/app-universal-release.apk katari-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-arm64-v8a-release.apk katari-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-armeabi-v7a-release.apk katari-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk

      # Which mpv add-on this release needs, so the version it updates from can bring the add-on along when the
      # installed one won't run with it. Read from the APK's copy of the libmpv load order, which the FOSS build shares.
      - name: Write the mpv add-on requirement
        env:
          TAG: ${{ needs.get_tag.outputs.tag }}
        run: |
          set -eo pipefail

          unzip -p "katari-$TAG.apk" assets/libmpv/load-order.json \
            | jq 'if .format == 2 and (.glue | type) == "number" and (.versionCode | type) == "number"
                 then {format: 1, glue: .glue, minVersionCode: .versionCode}
                 else error("not a format 2 libmpv load order") end' > "katari-$TAG-mpv.json"
          cat "katari-$TAG-mpv.json"

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: katari
          path: |
            katari-${{ needs.get_tag.outputs.tag }}.apk
            katari-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
            katari-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk
            katari-${{ needs.get_tag.outputs.tag }}-mpv.json

  build_foss:
    name: Build (FOSS)
    runs-on: ubuntu-26.04
    needs: get_tag
    if: needs.get_tag.outputs.tag != ''

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: true

      - name: Decode signing keystore
        run: echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/katari.keystore"
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      - name: Build
        run: ./gradlew assembleFoss verifyFossExtensionRuntimeAbi
        env:
          # Signs with the keystore below; the desktop job has none, so the app's build script must not ask for it.
          KATARI_GITHUB_RELEASE: true
          storeFile: ${{ runner.temp }}/katari.keystore
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: |
          set -e

          # Per-ABI FOSS names contain neither "-foss" nor "-<abi>", which earlier app versions match to pick their
          # update; see ReleaseApkSelection.kt.
          mv app/build/outputs/apk/foss/app-universal-foss.apk katari-${{ needs.get_tag.outputs.tag }}-foss.apk
          mv app/build/outputs/apk/foss/app-arm64-v8a-foss.apk katari_foss_arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/foss/app-armeabi-v7a-foss.apk katari_foss_armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: katari-foss
          path: |
            katari-${{ needs.get_tag.outputs.tag }}-foss.apk
            katari_foss_arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
            katari_foss_armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk

  release:
    name: Create GitHub Release
    runs-on: ubuntu-26.04
    needs: [get_tag, build, build_foss]
    permissions:
      contents: write

    steps:
      - name: Download the APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # katari and katari-foss, not the desktop app's
          pattern: katari*
          merge-multiple: true

      - name: Delete all artifacts
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          failOnError: false
          name: |
            katari
            katari-foss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.get_tag.outputs.tag }}
          name: ${{ needs.get_tag.outputs.tag }}
          # The commit GitHub tags on publishing, when the tag is not there yet.
          target_commitish: ${{ github.sha }}
          body: |
            ${{ needs.get_tag.outputs.notes }}

            > [!TIP]
            >
            > If you are unsure which version to download, use `katari-${{ needs.get_tag.outputs.tag }}.apk`.
          files: |
            katari-${{ needs.get_tag.outputs.tag }}.apk
            katari-${{ needs.get_tag.outputs.tag }}-foss.apk
            katari-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
            katari-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk
            katari_foss_arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
            katari_foss_armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk
            katari-${{ needs.get_tag.outputs.tag }}-mpv.json
          draft: true
          # A suffixed version (v1.2.0-beta1) is offered in the app only on the Pre-release update channel.
          prerelease: ${{ contains(needs.get_tag.outputs.tag, '-') }}

      # GitHub tags a draft only once it is published. The tag goes in now, and last: it is what
      # tells later pushes to main that this version is released.
      - name: Tag the draft's commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.get_tag.outputs.tag }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA"

  build_desktop:
    name: Build (desktop)
    runs-on: ubuntu-26.04
    needs: get_tag
    if: needs.get_tag.outputs.desktop_tag != ''

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: true

      - name: Build
        run: ./gradlew :desktop:packageAppImage -Pdesktop-release

      # Only the release build is named Katari-<version>; a development build, made without -Pdesktop-release,
      # finds nothing to upload and fails the release.
      - name: Upload AppImage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-appimage
          path: desktop/build/appimage/Katari-${{ needs.get_tag.outputs.desktop_version }}-x86_64.AppImage
          if-no-files-found: error

  release_desktop:
    name: Create GitHub Release (desktop)
    runs-on: ubuntu-26.04
    needs: [get_tag, build_desktop]
    permissions:
      contents: write

    steps:
      - name: Download the AppImage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-appimage

      - name: Delete the artifact
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          failOnError: false
          name: desktop-appimage

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.get_tag.outputs.desktop_tag }}
          name: ${{ needs.get_tag.outputs.desktop_tag }}
          target_commitish: ${{ github.sha }}
          body: ${{ needs.get_tag.outputs.desktop_notes }}
          files: Katari-${{ needs.get_tag.outputs.desktop_version }}-x86_64.AppImage
          draft: true
          # A suffixed version (0.1.0-alpha.1) is offered in the app only on the Pre-release update channel.
          prerelease: ${{ contains(needs.get_tag.outputs.desktop_version, '-') }}
          # GitHub's latest release is the Android app's, which the website's download buttons link
          make_latest: false

      - name: Tag the draft's commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.get_tag.outputs.desktop_tag }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA"
