name: Website

# Builds the website of the newest published release, so the site only ever describes an app people can download,
# with the captures on the `assets` branch, and deploys it to GitHub Pages. website-release.yml starts this workflow
# when a release is published, and the `assets` branch whenever a capture pull request is merged into it. A manual
# run can name another ref, such as a branch cut from the release tag with a website-only fix.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build the website from; empty builds the newest published release
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}
  # A Pages deployment cut off midway can leave the site half updated, so a newer run waits instead.
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - name: Pick the ref
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.ref }}
        run: |
          ref="${REQUESTED:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)}"
          echo "::notice::Building the website from $ref."
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Checkout captures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: assets
          path: assets

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        working-directory: website
        run: |
          npm ci
          npm run sync -- --from ../assets

      # The download buttons link the newest release's APKs, which the build reads from GitHub.
      - name: Build
        working-directory: website
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build

      - name: Upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    name: Deploy
    runs-on: ubuntu-26.04
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
