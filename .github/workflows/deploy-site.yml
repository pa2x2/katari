name: Deploy the website

# The website workflow lives on main and builds the newest published release with the captures here; a push here only
# asks that workflow to run so the site picks up the new captures.
on:
  push:
    branches:
      - assets

permissions: {}

jobs:
  deploy:
    name: Start the site deployment
    runs-on: ubuntu-24.04
    permissions:
      actions: write

    steps:
      - name: Start
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run website.yml --repo "$GITHUB_REPOSITORY" --ref main
