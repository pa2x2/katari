name: Website after a release

# A published release of either app deploys the website again, from main, which then describes it. The github-pages
# environment only takes deployments from main, and a release run's ref is its tag, so this asks the Website workflow
# to run on main instead of deploying itself.
on:
  release:
    types: [published]

permissions: {}

jobs:
  deploy:
    name: Start the website deployment
    # Only app releases, tagged v<version> or desktop-v<version>: the onnxruntime-<version> and sdk releases hold other
    # things.
    if: startsWith(github.event.release.tag_name, 'v') || startsWith(github.event.release.tag_name, 'desktop-v')
    runs-on: ubuntu-26.04
    permissions:
      actions: write

    steps:
      - name: Start
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run website.yml --repo "$GITHUB_REPOSITORY" --ref main
