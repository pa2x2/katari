name: Website after a release

# The website is built from the newest published release, so a published release deploys it again. The
# github-pages environment only takes deployments from main, and a release run's ref is its tag, so this asks the
# Website workflow to run on main instead of deploying itself.
on:
  release:
    types: [published]

permissions: {}

jobs:
  deploy:
    name: Start the website deployment
    # Only app releases, tagged v<version>: the onnxruntime-<version> releases hold a build dependency.
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-26.04
    permissions:
      actions: write

    steps:
      - name: Start
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run website.yml --repo "$GITHUB_REPOSITORY" --ref main
