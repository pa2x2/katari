name: Showcase

# Recaptures every showcase screenshot and clip from a published release on a freshly wiped emulator, and proposes
# the ones that visibly changed as a pull request against the `assets` branch, which the website is built from.
# It runs apart from the release workflow and never holds a release up.
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

env:
  RUN_NAME: ${{ github.event.release.tag_name || github.ref_name }}

jobs:
  # Runs the build's dependencies, downloaded content and a third-party APK, so it holds no write access; the
  # proposal job below publishes what it found.
  capture:
    name: Capture
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    env:
      # Matches showcase/pipeline/device/emulator.ts.
      SYSTEM_IMAGE: system-images;android-36.1;google_apis;x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout published captures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: assets
          path: published
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: showcase/package-lock.json

      - name: Set up the emulator
        run: |
          set -euo pipefail

          # Hardware acceleration, without which the emulator is too slow to boot.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

          sudo apt-get update
          sudo apt-get install --yes ffmpeg

          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # Fed from a process substitution rather than a pipe: the runner ignores SIGPIPE, so once sdkmanager stops
          # reading, `yes` fails with a broken pipe, which pipefail would turn into the step's failure.
          "$sdkmanager" --licenses < <(yes 2> /dev/null) > /dev/null
          # The image's command-line tools may predate the device profile the showcase emulator is created from. An
          # update installed by the running tools lands beside them, as latest-2.
          "$sdkmanager" --install "cmdline-tools;latest" emulator "$SYSTEM_IMAGE" > /dev/null
          tools="$(ls -d "$ANDROID_HOME"/cmdline-tools/latest* | sort -V | tail -n 1)"
          if ! "$tools/bin/avdmanager" list device -c | grep -qx pixel_9a; then
            echo "::error::The Android command-line tools have no pixel_9a device profile."
            exit 1
          fi
          {
            echo "$ANDROID_HOME/emulator"
            echo "$ANDROID_HOME/platform-tools"
            echo "$tools/bin"
          } >> "$GITHUB_PATH"

      # Outside the checkout, by an absolute path, which actions/cache needs. The runner context that names the runner's
      # temporary folder is not available to the job's env.
      - name: Locate the showcase cache
        run: echo "KATARI_SHOWCASE_CACHE=$RUNNER_TEMP/showcase-cache" >> "$GITHUB_ENV"

      # Upstream sites such as Project Gutenberg go down for hours, so a run reuses what earlier runs downloaded for the
      # same content definitions, and only has to reach them when those change.
      - name: Restore the showcase downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.KATARI_SHOWCASE_CACHE }}/downloads
          key: showcase-downloads-${{ hashFiles('showcase/content/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: showcase-downloads-${{ hashFiles('showcase/content/**') }}-

      # Before the build, so that an upstream site that cannot be reached fails the run in seconds.
      - name: Fetch the showcase content
        working-directory: showcase
        run: |
          npm ci
          npm run fetch
          npm run seed

      - name: Build
        run: ./gradlew :app:assembleBenchmark :showcase:extension:assembleDebug :showcase:capture:assembleBenchmark

      - name: Capture
        working-directory: showcase
        run: npm run capture -- --out "$RUNNER_TEMP/captures"

      # Also after a failure, so a later run starts from whatever this one managed to download, the film the player
      # streamed included.
      - name: Save the showcase downloads
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.KATARI_SHOWCASE_CACHE }}/downloads
          key: showcase-downloads-${{ hashFiles('showcase/content/**') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload what the failed capture left
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: showcase-failure
          path: ${{ runner.temp }}/captures
          if-no-files-found: ignore

      - name: Compare with the published captures
        id: compare
        run: |
          set -euo pipefail

          proposal="$RUNNER_TEMP/proposal"
          mkdir -p "$proposal/files"
          node showcase/pipeline/compare.ts --published published --captured "$RUNNER_TEMP/captures" > "$proposal/result.json"
          cat "$proposal/result.json"
          jq -r '.changed[]' "$proposal/result.json" | while read -r name; do
            cp "$RUNNER_TEMP/captures/$name" "$proposal/files/"
          done
          echo "changed=$(jq '.changed | length' "$proposal/result.json")" >> "$GITHUB_OUTPUT"

      - name: Upload the changed captures
        if: steps.compare.outputs.changed != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: showcase-proposal
          path: ${{ runner.temp }}/proposal

  propose:
    name: Propose the changed captures
    runs-on: ubuntu-26.04
    needs: capture
    if: needs.capture.outputs.changed != '0'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout published captures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: assets

      - name: Download the changed captures
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: showcase-proposal
          path: ${{ runner.temp }}/proposal

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          result="$RUNNER_TEMP/proposal/result.json"
          # A proposal nobody has merged yet is replaced rather than joined by another, so only the latest captures wait
          # for review. Its branch gets one commit on top of assets, whatever an earlier run pushed there.
          existing="$(gh pr list --base assets --state open --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("showcase/"))] | first // empty | "\(.number) \(.headRefName)"')"
          if [[ -n "$existing" ]]; then
            read -r number branch <<< "$existing"
          else
            number=""
            branch="showcase/proposal"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$branch"
          cp "$RUNNER_TEMP"/proposal/files/* .
          git add --all
          git commit --message "(docs): refresh the showcase captures for $RUN_NAME"
          git push --force origin "$branch"

          {
            echo "Captured from \`$RUN_NAME\`. Changed:"
            echo
            jq -r '.changed[] | "- `\(.)`"' "$result"
            if [[ "$(jq '.retired | length' "$result")" != 0 ]]; then
              echo
              echo "No longer captured, left in place for a person to remove:"
              echo
              jq -r '.retired[] | "- `\(.)`"' "$result"
            fi
          } > "$RUNNER_TEMP/body.md"
          title="(docs): refresh the showcase captures for $RUN_NAME"
          if [[ -n "$number" ]]; then
            gh pr edit "$number" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base assets --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
