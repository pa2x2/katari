name: Showcase

# Recaptures every showcase screenshot and clip from a published release on a freshly wiped emulator, and proposes
# the ones that visibly changed, and the removal of any no scene captures any more, as a pull request against the
# `assets` branch, which the website is built from.
# It runs apart from the release workflow and never holds a release up.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      propose:
        description: Propose the changed captures. Off, the run only checks that every scene captures.
        type: boolean
        default: true

# Runs that propose replace one another's proposal, so they take turns. A run that only checks the scenes runs alongside
# anything. The input is read as text: missing on a release, it would compare equal to false as a boolean.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.propose == 'false' && github.run_id || 'proposal' }}
  cancel-in-progress: false

permissions: {}

env:
  RUN_NAME: ${{ github.event.release.tag_name || github.ref_name }}

jobs:
  # Runs the build's dependencies, downloaded content and a third-party APK, so it holds no write access; the
  # proposal job below publishes what it found.
  capture:
    name: Capture
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      # Reads the downloads an earlier run kept.
      actions: read
      contents: read
    outputs:
      differences: ${{ steps.compare.outputs.differences }}
    env:
      # Matches showcase/pipeline/device/emulator.ts.
      SYSTEM_IMAGE: system-images;android-36.1;google_apis;x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout published captures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: assets
          path: published
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: showcase/package-lock.json

      - name: Set up the emulator
        run: |
          set -euo pipefail

          # Hardware acceleration, without which the emulator is too slow to boot.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

          sudo apt-get update
          sudo apt-get install --yes ffmpeg

          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # Fed from a process substitution rather than a pipe: the runner ignores SIGPIPE, so once sdkmanager stops
          # reading, `yes` fails with a broken pipe, which pipefail would turn into the step's failure.
          "$sdkmanager" --licenses < <(yes 2> /dev/null) > /dev/null
          # The image's command-line tools may predate the device profile the showcase emulator is created from. An
          # update installed by the running tools lands beside them, as latest-2. A download cut short fails the install
          # with "Error reading Zip content", and the next attempt downloads it again.
          for attempt in 1 2 3; do
            if "$sdkmanager" --install "cmdline-tools;latest" emulator "$SYSTEM_IMAGE" > /dev/null; then break; fi
            if [ "$attempt" = 3 ]; then
              echo "::error::The Android SDK packages did not install in 3 attempts."
              exit 1
            fi
          done
          tools="$(ls -d "$ANDROID_HOME"/cmdline-tools/latest* | sort -V | tail -n 1)"
          if ! "$tools/bin/avdmanager" list device -c | grep -qx pixel_9a; then
            echo "::error::The Android command-line tools have no pixel_9a device profile."
            exit 1
          fi
          {
            echo "$ANDROID_HOME/emulator"
            echo "$ANDROID_HOME/platform-tools"
            echo "$tools/bin"
          } >> "$GITHUB_PATH"

      # Outside the checkout, by an absolute path. The runner context that names the runner's temporary folder is not
      # available to the job's env.
      - name: Locate the showcase cache
        run: echo "KATARI_SHOWCASE_CACHE=$RUNNER_TEMP/showcase-cache" >> "$GITHUB_ENV"

      # Upstream sites such as Project Gutenberg go down for hours and Wikimedia limits how often it is asked, so a run
      # starts from what the last run that downloaded anything kept. It is an artifact rather than an Actions cache: a
      # release's run can only read caches of its tag and of main, and the build's Gradle caches, written on every push
      # to upcoming, evict the rest of a repository's caches within hours.
      - name: Restore the showcase downloads
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          downloads="$KATARI_SHOWCASE_CACHE/downloads"
          mkdir -p "$downloads"
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=showcase-downloads&per_page=1" \
            --jq '.artifacts[] | select(.expired | not) | .workflow_run.id')"
          if [[ -n "$run" ]]; then
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --name showcase-downloads --dir "$downloads"
          fi
          # Written after the restore, so that the files the run reads, whose modification time the download cache renews,
          # are newer than it and the rest are not.
          ls "$downloads" > "$RUNNER_TEMP/restored-downloads"
          echo "Restored $(wc -l < "$RUNNER_TEMP/restored-downloads") downloads${run:+ from run $run}."

      # Before the build, so that an upstream site that cannot be reached fails the run in seconds.
      - name: Fetch the showcase content
        working-directory: showcase
        run: |
          npm ci
          npm run fetch
          npm run seed

      - name: Build
        run: ./gradlew :app:assembleBenchmark :showcase:extension:assembleDebug :showcase:capture:assembleBenchmark

      - name: Capture
        id: capture
        working-directory: showcase
        run: npm run capture -- --out "$RUNNER_TEMP/captures"

      - name: Note whether the run changed the downloads
        id: downloads
        if: always() && steps.restore.outcome == 'success'
        env:
          CAPTURED: ${{ steps.capture.outcome }}
        run: |
          set -euo pipefail

          downloads="$KATARI_SHOWCASE_CACHE/downloads"
          find "$downloads" -name '*.partial' -delete
          # Once every scene has run, what the run did not read goes, which is how a download sources.ts no longer
          # needs leaves. A failed run keeps it all, since the scenes after the failure never read theirs.
          if [[ "$CAPTURED" == success ]]; then
            find "$downloads" -type f ! -newer "$RUNNER_TEMP/restored-downloads" -delete
          fi
          ls "$downloads" > "$RUNNER_TEMP/kept-downloads"
          if cmp -s "$RUNNER_TEMP/restored-downloads" "$RUNNER_TEMP/kept-downloads"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Only when something changed, so the latest one is the one to restore. Also after a failure, so a later run starts
      # from whatever this one managed to download, the film the player streamed included.
      - name: Keep the showcase downloads for later runs
        if: always() && steps.downloads.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: showcase-downloads
          path: ${{ env.KATARI_SHOWCASE_CACHE }}/downloads
          # Books and videos are compressed already.
          compression-level: 0
          # A rerun of the job replaces what its earlier attempt kept.
          overwrite: true

      - name: Upload what the failed capture left
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: showcase-failure
          path: ${{ runner.temp }}/captures
          if-no-files-found: ignore
          overwrite: true

      # The benchmark build is minified, so the app's frames in a failure's thread dumps read only through its mapping.
      - name: Upload the app's mapping for the failure's thread dumps
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: showcase-failure-mapping
          path: app/build/outputs/mapping/benchmark/mapping.txt
          if-no-files-found: ignore
          overwrite: true

      - name: Compare with the published captures
        id: compare
        run: |
          set -euo pipefail

          proposal="$RUNNER_TEMP/proposal"
          mkdir -p "$proposal/files"
          node showcase/pipeline/compare.ts --published published --captured "$RUNNER_TEMP/captures" > "$proposal/result.json"
          cat "$proposal/result.json"
          jq -r '.changed[]' "$proposal/result.json" | while read -r name; do
            cp "$RUNNER_TEMP/captures/$name" "$proposal/files/"
          done
          echo "differences=$(jq '(.changed | length) + (.retired | length)' "$proposal/result.json")" >> "$GITHUB_OUTPUT"

      - name: Upload the changed captures
        if: steps.compare.outputs.differences != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: showcase-proposal
          path: ${{ runner.temp }}/proposal
          overwrite: true

  propose:
    name: Propose the changed captures
    runs-on: ubuntu-26.04
    needs: capture
    if: needs.capture.outputs.differences != '0' && github.event.inputs.propose != 'false'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout published captures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: assets

      - name: Download the changed captures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: showcase-proposal
          path: ${{ runner.temp }}/proposal

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          # Captures change what the website shows, so their owner reviews every proposal.
          REVIEWER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          result="$RUNNER_TEMP/proposal/result.json"
          # A proposal nobody has merged yet is replaced rather than joined by another, so only the latest captures wait
          # for review. Its branch gets one commit on top of assets, whatever an earlier run pushed there.
          existing="$(gh pr list --base assets --state open --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("showcase/"))] | first // empty | "\(.number) \(.headRefName)"')"
          if [[ -n "$existing" ]]; then
            read -r number branch <<< "$existing"
          else
            number=""
            branch="showcase/proposal"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$branch"
          cp -r "$RUNNER_TEMP/proposal/files/." .
          # The website shows only what the scenes capture, so a capture no scene takes any more goes too.
          jq -r '.retired[]' "$result" | while read -r name; do
            git rm --quiet -- "$name"
          done
          git add --all
          git commit --message "(docs): refresh the showcase captures for $RUN_NAME"
          git push --force origin "$branch"

          {
            echo "Captured from \`$RUN_NAME\`."
            if [[ "$(jq '.changed | length' "$result")" != 0 ]]; then
              echo
              echo "Changed:"
              echo
              jq -r '.changed[] | "- `\(.)`"' "$result"
            fi
            if [[ "$(jq '.retired | length' "$result")" != 0 ]]; then
              echo
              echo "Removed, since no scene captures them any more:"
              echo
              jq -r '.retired[] | "- `\(.)`"' "$result"
            fi
          } > "$RUNNER_TEMP/body.md"
          title="(docs): refresh the showcase captures for $RUN_NAME"
          if [[ -n "$number" ]]; then
            gh pr edit "$number" --title "$title" --body-file "$RUNNER_TEMP/body.md" --add-assignee "$REVIEWER"
          else
            gh pr create --base assets --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/body.md" \
              --assignee "$REVIEWER"
          fi
