name: Sync server image

# Publishing a sync server release, tagged sync-server-v<version>, builds its image from the tag and pushes it to this
# repository's packages. Nothing is pushed before, so a draft reaches nobody, as the apps' drafts don't. The website
# deploys again once the image is there, so it never names a version that can't be pulled; website-release.yml leaves
# server releases to this workflow for that reason.
on:
  release:
    types: [published]

permissions: {}

jobs:
  image:
    name: Publish the sync server image
    if: startsWith(github.event.release.tag_name, 'sync-server-v')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      actions: write
    env:
      TAG: ${{ github.event.release.tag_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: true

      # release.yml tested this commit before it drafted the release.
      - name: Build the server
        run: ./gradlew :features:sync:server:installDist

      - name: Name the image and its tags
        id: names
        shell: bash
        run: |
          set -euo pipefail

          version="${TAG#sync-server-v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # Registry names must be lowercase; owners may not be.
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/katari-sync-server"
          tags="$image:$version"
          if [[ "$version" != *-* ]]; then
            tags+=",$image:${version%.*},$image:latest"
          # :latest follows pre-releases until the first stable version, so the setup commands work from the start.
          elif ! git ls-remote --tags origin 'refs/tags/sync-server-v*' | sed 's#.*refs/tags/sync-server-v##; s#\^{}$##' | grep -qv -- -; then
            tags+=",$image:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      # Emulation runs the Dockerfile's one RUN step for arm64.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Sign in to GitHub Packages
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: features/sync/server/build/install/katari-sync-server
          file: features/sync/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.tags }}
          # The source label links the package to this repository on GitHub.
          labels: |
            org.opencontainers.image.title=Katari sync server
            org.opencontainers.image.description=Self-hosted synchronization server for Katari
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.names.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
          # Without this, the package page lists an extra unknown/unknown platform per architecture.
          provenance: false

      # The github-pages environment only takes deployments from main, and this run's ref is the tag.
      - name: Deploy the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run website.yml --repo "$GITHUB_REPOSITORY" --ref main
