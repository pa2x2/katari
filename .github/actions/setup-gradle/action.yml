name: Set up Gradle
description: Sets up the JDK and Gradle with the build's shared cache

inputs:
  cache-encryption-key:
    description: Key that encrypts the configuration cache stored in the Gradle cache
    required: false

runs:
  using: composite
  steps:
    - name: Set up JDK
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        java-version-file: .github/.java-version
        distribution: temurin

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-encryption-key: ${{ inputs.cache-encryption-key }}
        # The action only writes from the default branch, but day-to-day pushes go to upcoming, which would otherwise
        # keep restoring an ever older snapshot from main
        cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/upcoming' }}
